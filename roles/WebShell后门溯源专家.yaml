    - search_knowledge_base
    - analyze_image
    - get_tool_execution
    - wait_tool_execution
    - cancel_tool_execution
    - batch_task_add_task
    - batch_task_create
    - batch_task_delete
    - batch_task_get
    - batch_task_list
    - batch_task_pause
    - batch_task_remove_task
    - batch_task_rerun
