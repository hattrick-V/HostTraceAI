<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HostTraceAI animated logo">
  <style>
    .boundary { fill: #F8FAFC; }
    .trace { stroke: #4DA3FF; }
    .node { fill: #4DA3FF; }
    .spark { fill: #22D3EE; }
    .route { stroke-dasharray: 52; stroke-dashoffset: 52; animation: draw .7s cubic-bezier(.22,1,.36,1) forwards; }
    .node { opacity: 0; animation: node-on .18s ease-out forwards; }
    .node-1 { animation-delay: .24s; }
    .node-2 { animation-delay: .48s; }
    .node-3 { animation-delay: .7s; }
    .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: spark-on .38s .82s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes node-on { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes spark-on { 0% { opacity: 0; transform: scale(.45) rotate(-20deg); } 65% { opacity: 1; transform: scale(1.16) rotate(0); } 100% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .route { stroke-dashoffset: 0; animation: none; }
      .node, .spark { opacity: 1; animation: none; }
    }
  </style>
  <defs>
    <mask id="ht-cutout-motion-dark" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M19 18v28M43 18v28M19 32h24" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    </mask>
  </defs>
  <path class="boundary" d="M20 4h24q4 0 6.2 3.8l11 19q2.2 4.2 0 8.4l-11 21Q48 60 44 60H20q-4 0-6.2-3.8l-11-21q-2.2-4.2 0-8.4l11-19Q16 4 20 4Z" mask="url(#ht-cutout-motion-dark)"/>
  <path class="trace route" d="m14 43 10-9 9 4 11-10 7 3" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="node node-1" cx="14" cy="43" r="2.2"/>
  <circle class="node node-2" cx="33" cy="38" r="2.2"/>
  <circle class="node node-3" cx="51" cy="31" r="2.2"/>
  <path class="spark" d="m50 9 1.7 4.3L56 15l-4.3 1.7L50 21l-1.7-4.3L44 15l4.3-1.7Z"/>
</svg>
